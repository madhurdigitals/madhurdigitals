<!DOCTYPE html>
<html>
<head>
  <title>Print Students</title>

  <script src="js/protect.js"></script>
  <script src="js/api.js"></script>
  <script src="js/print_student.js" defer></script>

  <link rel="stylesheet" href="css/print_student.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h2>Print Students</h2>

<div class="container">

  <!-- FILTERS -->
  <div class="card">

    <!-- Search -->
    <input id="searchName" placeholder="Search Name">

    <!-- Class Section Dropdown -->
    <div style="margin-top:10px;">
      <div class="dropdown">
        <button onclick="toggleDropdown('classSectionOptions', event)">
          Select Class-Section
        </button>

        <div id="classSectionOptions" class="dropdown-content"></div>
      </div>
    </div>

  </div>

  <!-- TABLE -->
  <div class="card">

    <div class="table-wrapper">
      <table>
        <thead></thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div id="pagination" style="margin-top:10px;"></div>

    <br>
    <button onclick="generateCards()" class="submit-btn">
      Generate Cards
    </button>

  </div>

  <div id="cardSection" class="card" style="display:none; text-align:center;">

    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:10px;">
      <button onclick="window.print()" class="submit-btn">Print</button>
    </div>

    <div id="cardContainer"></div>

  </div>
</div>

</body>
</html>
