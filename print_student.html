<!DOCTYPE html>
<html>
<head>
  <title>Print Cards</title>

  <script src="js/protect.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="card_templates/template_registry.js"></script>
  <script src="js/custom_template_renderer.js"></script>
  <script src="js/print_student.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link rel="stylesheet" href="css/print_student.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    #printTypeTabs { display:none; justify-content:center; gap:8px; margin:10px auto 4px; flex-wrap:wrap; }
    #printTypeTabs button { padding:9px 18px; border-radius:22px; border:2px solid #d1d5db; background:#fff; font-size:14px; font-weight:700; cursor:pointer; color:#374151; }
    #printTypeTabs button.on { background:#0d6efd; border-color:#0d6efd; color:#fff; }
    #noDesignBox { display:none; margin-top:12px; padding:10px 12px; border-radius:8px; border:1px solid; font-size:14px; }
    #checklistSection { display:none; }
    #checklistContainer { background:#e5e7eb; padding:10px; overflow:auto; }
    @media print { #checklistSection { display:none !important; } }
  </style>
</head>

<body>

<nav>
  <div class="logo" onclick="location.href='dashboard.html'" style="cursor:pointer;">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <div>
      <div class="title-text">Madhur Digitals</div>
      <div class="school-name" id="schoolNameTop"></div>
    </div>
  </div>

  <div class="nav-actions">
    <button onclick="location.href='dashboard.html'">Dashboard</button>
    <button onclick="logout()">Logout</button>
  </div>
</nav>

<div class="heading-wrapper">
  <div class="heading-badge">
    <span id="printHeading">🎓 Print Students</span>: <span id="schoolName"></span>
  </div>
</div>
<div id="printTypeTabs" title="Which cards to print"></div>

<div class="container">

  <!-- FILTERS -->
  <div class="card">

    <input id="searchName" placeholder="Search name or ID">

    <div id="noDesignBox"></div>

    <div style="margin-top:15px;">
      <b>Select Fields for Card:</b>
      <div id="fieldSelector" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:5px;"></div>
    </div>

    <div style="margin-top:10px;">
      <div class="dropdown">
        <button onclick="toggleDropdown('classSectionOptions', event)" id="groupBtn">
          Select Class-Section
        </button>
        <div id="classSectionOptions" class="dropdown-content"></div>
      </div>
    </div>

  </div>

  <!-- TABLE -->
  <div class="card">

    <div class="table-wrapper">
      <div style="
        display:flex;
        align-items:center;
        justify-content:center;
        margin-bottom:10px;
        position:relative;
        width:100%;
      ">
        <div style="
          position:absolute;
          left:0;
          display:flex;
          align-items:center;
          gap:6px;
          white-space:nowrap;
        ">
          <input type="checkbox" id="globalSelect">
          <label for="globalSelect">Select / Deselect All</label>
        </div>

        <div id="selectionCount" style="font-weight:600;">
          Selected: 0
        </div>
      </div>

      <table>
        <thead></thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>

    <div id="pagination" style="margin-top:10px;"></div>

    <br>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button onclick="generateCards()" class="submit-btn" id="generateBtn" title="Make the cards of the selected people with the card design">
        Generate Cards (0)
      </button>
      <button onclick="showChecklist()" class="submit-btn" id="checklistBtn" style="background:#374151;" title="A plain black & white list for the school to check the data before printing">
        📋 Verification checklist
      </button>
    </div>

  </div>

  <!-- VERIFICATION CHECKLIST -->
  <div id="checklistSection" class="card" style="text-align:center;">
    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:10px; flex-wrap:wrap;">
      <button onclick="printChecklist()" class="submit-btn" title="Print the checklist (A4, black & white)">🖨 Print checklist</button>
      <button onclick="downloadChecklistPDF()" class="submit-btn" title="Save the checklist as a PDF to send to the school">⬇ Download checklist PDF</button>
      <button onclick="document.getElementById('checklistSection').style.display='none'" class="clear-btn">Close</button>
    </div>
    <div id="checklistContainer"></div>
  </div>

  <div id="cardSection" class="card" style="display:none; text-align:center;">

    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:10px; flex-wrap:wrap;">
      <button onclick="printAllCards()" class="submit-btn">Print</button>
      <button onclick="downloadCardsPDF()" class="submit-btn">Download PDF</button>
      <button onclick="printBackSheet()" class="submit-btn" id="printBackBtn" style="display:none;">Print Back Sheet</button>
      <button onclick="downloadBackSheetPDF()" class="submit-btn" id="downloadBackBtn" style="display:none;">Download Back PDF</button>
    </div>

    <div id="cardPagination" style="margin-bottom:10px;"></div>
    <div id="cardContainer"></div>

  </div>
</div>

<div id="pdfLoadingOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:99999; align-items:center; justify-content:center; flex-direction:column;">
  <div style="background:#fff; padding:30px 40px; border-radius:14px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.2);">
    <div class="pdf-spinner"></div>
    <p id="pdfLoadingText" style="margin-top:15px; font-weight:600; color:#374151;">Preparing PDF...</p>
  </div>
</div>

<script>
  // Set school name in nav
  const _schoolName = sessionStorage.getItem("school_name") || sessionStorage.getItem("school") || "";
  document.getElementById("schoolName").innerText = _schoolName;
  document.getElementById("schoolNameTop").innerText = _schoolName;
</script>

</body>
</html>
