<!DOCTYPE html>
<html>
<head>
  <title>Export Students</title>

  <script src="js/protect.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/export_student.js" defer></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="css/export_student.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .field-selector-grid {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
    }
    .field-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 20px;
      background: #f9fafb; cursor: pointer; font-size: 13px; color: #374151;
      transition: 0.15s;
    }
    .field-chip:hover { border-color: #0d6efd; }
    .field-chip.active {
      background: #e0f2fe; border-color: #0d6efd; color: #0369a1; font-weight: 600;
    }
    .field-chip input { accent-color: #0d6efd; cursor: pointer; }
    .field-quick-btn {
      padding: 5px 12px; border-radius: 6px; border: 1px solid #d1d5db;
      background: #fff; font-size: 12px; cursor: pointer; color: #374151;
    }
    .field-quick-btn:hover { background: #f0f7ff; border-color: #0d6efd; }
  </style>
</head>

<body>

<nav>
  <div class="logo" onclick="location.href='dashboard.html'" style="cursor:pointer;">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <div>
      <div class="title-text">Madhur Digitals</div>
      <div class="school-name" id="schoolNameTop"></div>
    </div>
  </div>

  <div class="nav-actions">
    <button onclick="location.href='dashboard.html'">Dashboard</button>
    <button onclick="logout()">Logout</button>
  </div>
</nav>

<div class="heading-wrapper">
  <div class="heading-badge">
    Export Students: <span id="schoolName"></span>
  </div>
</div>

<div class="container">

  <!-- FILTERS -->
  <div class="card">

    <input id="searchName" placeholder="Search Name">

    <div style="margin-top:15px;">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <b>Select Fields for Card / Excel:</b>
        <div style="display:flex; gap:8px;">
          <button type="button" class="field-quick-btn" onclick="selectAllFields()">Select All</button>
          <button type="button" class="field-quick-btn" onclick="clearAllFields()">Clear All</button>
        </div>
      </div>
      <div id="fieldSelector" class="field-selector-grid"></div>
    </div>

    <div style="margin-top:10px;">
      <div class="dropdown">
        <button onclick="toggleDropdown('classSectionOptions', event)">
          Select Class-Section
        </button>
        <div id="classSectionOptions" class="dropdown-content"></div>
      </div>
    </div>

  </div>

  <!-- TABLE -->
  <div class="card">

    <div class="table-wrapper">
      <div style="
        display:flex;
        align-items:center;
        justify-content:center;
        margin-bottom:10px;
        position:relative;
        width:100%;
      ">
        <div style="
          position:absolute;
          left:0;
          display:flex;
          align-items:center;
          gap:6px;
          white-space:nowrap;
        ">
          <input type="checkbox" id="globalSelect">
          <label for="globalSelect">Select / Deselect All</label>
        </div>

        <div id="selectionCount" style="font-weight:600;">
          Selected: 0 students
        </div>
      </div>

      <table>
        <thead></thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>

    <div id="pagination" style="margin-top:10px;"></div>

    <br>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button onclick="exportCardsPDF()" class="submit-btn export-btn" id="exportCardsBtn">
        📄 Export Cards PDF (0)
      </button>
      <button onclick="exportExcel()" class="submit-btn export-btn excel-btn" id="exportExcelBtn">
        📊 Export Excel (0)
      </button>
    </div>

  </div>

  <!-- HIDDEN CARD RENDER AREA -->
  <div id="cardSection" style="display:none;">
    <div id="cardContainer"></div>
  </div>

</div>

<script>
  const _schoolName = sessionStorage.getItem("school_name") || sessionStorage.getItem("school") || "";
  document.getElementById("schoolName").innerText = _schoolName;
  document.getElementById("schoolNameTop").innerText = _schoolName;
</script>

</body>
</html>
