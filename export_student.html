<!DOCTYPE html>
<html>
<head>
  <title>Export Students</title>

  <script src="js/protect.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/export_student.js" defer></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="css/export_student.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<nav>
  <div class="logo" onclick="location.href='dashboard.html'" style="cursor:pointer;">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <div>
      <div class="title-text">Madhur Digitals</div>
      <div class="school-name" id="schoolNameTop"></div>
    </div>
  </div>

  <div class="nav-actions">
    <button onclick="location.href='dashboard.html'">Dashboard</button>
    <button onclick="logout()">Logout</button>
  </div>
</nav>

<div class="heading-wrapper">
  <div class="heading-badge">
    Export Students: <span id="schoolName"></span>
  </div>
</div>

<div class="container">

  <!-- FILTERS -->
  <div class="card">

    <input id="searchName" placeholder="Search Name">

    <div style="margin-top:15px;">
      <b>Select Fields for Card / Excel:</b>
      <div id="fieldSelector" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:5px;"></div>
    </div>

    <div style="margin-top:10px;">
      <div class="dropdown">
        <button onclick="toggleDropdown('classSectionOptions', event)">
          Select Class-Section
        </button>
        <div id="classSectionOptions" class="dropdown-content"></div>
      </div>
    </div>

  </div>

  <!-- TABLE -->
  <div class="card">

    <div class="table-wrapper">
      <div style="
        display:flex;
        align-items:center;
        justify-content:center;
        margin-bottom:10px;
        position:relative;
        width:100%;
      ">
        <div style="
          position:absolute;
          left:0;
          display:flex;
          align-items:center;
          gap:6px;
          white-space:nowrap;
        ">
          <input type="checkbox" id="globalSelect">
          <label for="globalSelect">Select / Deselect All</label>
        </div>

        <div id="selectionCount" style="font-weight:600;">
          Selected: 0 students
        </div>
      </div>

      <table>
        <thead></thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>

    <div id="pagination" style="margin-top:10px;"></div>

    <br>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button onclick="exportCardsPDF()" class="submit-btn export-btn" id="exportCardsBtn">
        📄 Export Cards PDF (0)
      </button>
      <button onclick="exportExcel()" class="submit-btn export-btn excel-btn" id="exportExcelBtn">
        📊 Export Excel (0)
      </button>
    </div>

  </div>

  <!-- HIDDEN CARD RENDER AREA -->
  <div id="cardSection" style="display:none;">
    <div id="cardContainer"></div>
  </div>

</div>

<script>
  const _schoolName = sessionStorage.getItem("school_name") || sessionStorage.getItem("school") || "";
  document.getElementById("schoolName").innerText = _schoolName;
  document.getElementById("schoolNameTop").innerText = _schoolName;
</script>

</body>
</html>
