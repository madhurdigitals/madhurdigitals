<!DOCTYPE html>
<html>
<head>
  <title>Restore Records — Madhur Digitals</title>
  <script src="js/protect.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/restore_student.js" defer></script>

  <link rel="stylesheet" href="css/manage_student.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .rs-tabs { display:flex; justify-content:center; gap:8px; margin:10px auto 4px; flex-wrap:wrap; }
    .rs-tabs button { padding:9px 18px; border-radius:22px; border:2px solid #d1d5db; background:#fff; font-size:14px; font-weight:700; cursor:pointer; color:#374151; }
    .rs-tabs button.on.students { background:#0d6efd; border-color:#0d6efd; color:#fff; }
    .rs-tabs button.on.staff    { background:#059669; border-color:#059669; color:#fff; }
    .rs-filters { display:flex; gap:10px; flex-wrap:wrap; }
    .rs-filters input, .rs-filters select { padding:8px 10px; border-radius:8px; border:1px solid #d1d5db; min-width:160px; }
    .rs-bulk { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .rs-bulk .count { font-weight:700; color:#374151; margin-right:auto; }
    .rs-btn { padding:8px 14px; border-radius:8px; border:1px solid #d1d5db; background:#fff; font-size:13px; font-weight:600; cursor:pointer; }
    .rs-btn.restore { border-color:#16a34a; color:#166534; background:#f0fdf4; }
    .rs-btn.purge   { border-color:#dc2626; color:#991b1b; background:#fef2f2; }
    .rs-btn:disabled { opacity:.55; cursor:not-allowed; }
    .rs-row-btn { padding:5px 10px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; margin:2px; }
    .rs-row-btn.restore { border:1px solid #16a34a; color:#166534; background:#f0fdf4; }
    .rs-row-btn.purge   { border:1px solid #dc2626; color:#991b1b; background:#fef2f2; }
    .rs-progress { display:none; margin:8px 0; font-size:13px; color:#374151; }
    .rs-result { display:none; margin:8px 0; padding:10px 12px; border-radius:8px; font-size:13px; }
    .rs-result.ok { background:#f0fdf4; border:1px solid #86efac; color:#166534; }
    .rs-result.bad { background:#fef2f2; border:1px solid #fca5a5; color:#991b1b; }
    .rs-empty { color:#6b7280; padding:16px; text-align:center; }
    #rsConfirm { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:3000; display:none; align-items:center; justify-content:center; }
    #rsConfirm .box { background:#fff; border-radius:14px; padding:22px; width:440px; max-width:92%; box-shadow:0 10px 40px rgba(0,0,0,.25); }
    #rsConfirm h3 { margin:0 0 8px; color:#991b1b; }
    #rsConfirm ul { max-height:140px; overflow:auto; font-size:13px; padding-left:18px; }
    #rsConfirm input { width:100%; padding:9px; border-radius:8px; border:1px solid #d1d5db; box-sizing:border-box; margin:8px 0 12px; font-size:15px; }
  </style>
</head>

<body>

<nav>
  <div class="logo" onclick="location.href='dashboard.html'" style="cursor:pointer;">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <div class="title-text">Madhur Digitals</div>
  </div>
  <div class="nav-actions">
    <button onclick="location.href='dashboard.html'">Dashboard</button>
    <button onclick="logout()">Logout</button>
  </div>
</nav>

<div class="heading-wrapper">
  <div class="heading-badge" id="rsHeading">♻️ Restore Students</div>
</div>
<div class="rs-tabs" id="rsTabs" style="display:none;">
  <button type="button" class="students on" data-type="students" title="Deleted students">🎓 Students</button>
  <button type="button" class="staff" data-type="staff" title="Deleted staff and management">👩‍🏫 Staff</button>
</div>

<div class="container">

  <div class="card">
    <div class="rs-filters">
      <input id="searchName" placeholder="Search name or ID" title="Type part of a name or ID">
      <select id="filterSchool" title="Only this school"><option value="">All schools</option></select>
      <select id="filterGroup1" title=""></select>
      <select id="filterGroup2" title=""></select>
    </div>
  </div>

  <div class="card">
    <div class="rs-bulk">
      <label style="display:flex; gap:6px; align-items:center;" title="Select every record shown below">
        <input type="checkbox" id="selectAllShown"> Select all shown
      </label>
      <span class="count" id="rsCount">Selected: 0</span>
      <button type="button" class="rs-btn restore" id="btnRestoreSel" title="Put the selected records back where they were">↩ Restore selected</button>
      <button type="button" class="rs-btn purge" id="btnPurgeSel" style="display:none;" title="Remove the selected records for good (admins only)">🗑 Delete permanently</button>
    </div>
    <div class="rs-progress" id="rsProgress"></div>
    <div class="rs-result" id="rsResult"></div>
    <div class="table-wrapper">
      <table>
        <thead id="rsHead"></thead>
        <tbody id="rsBody"><tr><td class="rs-empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

</div>

<!-- CONFIRM: DELETE PERMANENTLY -->
<div id="rsConfirm">
  <div class="box">
    <h3>🗑 Delete permanently?</h3>
    <p style="font-size:14px; margin:0 0 6px;" id="rsConfirmText"></p>
    <ul id="rsConfirmList"></ul>
    <p style="font-size:13px; color:#991b1b; font-weight:700; margin:6px 0 0;">This cannot be undone. Their photos are removed too.</p>
    <label style="font-size:13px;">Type <b>DELETE</b> to confirm:</label>
    <input id="rsConfirmInput" autocomplete="off">
    <div style="display:flex; gap:8px;">
      <button type="button" class="rs-btn purge" id="rsConfirmGo" disabled style="flex:1;">Delete permanently</button>
      <button type="button" class="rs-btn" id="rsConfirmCancel">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

</body>
</html>
