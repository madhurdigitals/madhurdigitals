<!DOCTYPE html>
<html>
<head>
  <title>Students Entry</title>
  <script src="js/protect.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>

  <link rel="stylesheet" href="css/add_student.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .photo-upload-wrap {
      display: flex;
      align-items: center;

      flex: 1;

    }
    .photo-upload-wrap img {

      color: #9ca3af;
      font-size: 12px;
    }
    .camera-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #0d6efd;
      background: #fff;
      color: #0d6efd;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .camera-btn:hover { background: #0d6efd; color: #fff; }
  </style>
</head>

<body>
<div class="page-wrapper">
<nav>
  <div class="logo">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <div>
      <div class="title-text">Madhur Digitals</div>
      <div class="school-name" id="schoolNameTop"></div>
    </div>
  </div>

  <div class="nav-actions">
    <button onclick="changeSchool()">Change School</button>
    <button onclick="location.href='dashboard.html'">Dashboard</button>
    <button onclick="logout()">Logout</button>
  </div>
</nav>
<div class="heading-wrapper">
  <div class="heading-badge">
    School: <span id="schoolName"></span>
  </div>
</div>
<div class="container">

  <div class="card">
    <h3>Add Student</h3>
    <div id="dynamicForm"></div>

    <div class="btn-group">
      <button type="button" class="submit-btn" onclick="submitStudent()">Submit</button>
      <button class="clear-btn" onclick="clearForm()">Clear</button>
    </div>
  </div>

  <div class="card">
    <h3>Recent Entries</h3>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Class</th>
            <th>Section</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="recentTable"></tbody>
      </table>
    </div>
  </div> 
</div>

<div id="toast"></div>

<!-- school box -->

<div id="schoolBox" class="school-box">

  <div class="modal">
    <div class="school-header">
      <h3>Select School</h3>
      <span class="close-btn" onclick="hideSchoolSelector()">✖</span>
    </div>

    <select id="schoolSelect">
      <option value="">Loading...</option>
    </select>

    <br><br>
    <button onclick="applySchoolChange()">Apply</button>
  </div>

</div>
<div id="editPopup" class="school-box">
  <div class="modal" id="editModalContent"></div>
</div>

<!-- CAMERA CAPTURE POPUP -->
<div id="cameraPopup" class="school-box">
  <div class="modal" style="width:420px; max-width:95%;">
    <div class="school-header">
      <h3>Take Photo</h3>
      <span class="close-btn" onclick="closeCamera()">✖</span>
    </div>
    <video id="cameraVideo" autoplay playsinline style="width:100%; border-radius:10px; background:#000;"></video>
    <canvas id="cameraCanvas" style="display:none;"></canvas>
    <div class="btn-group" style="margin-top:12px;">
      <button class="submit-btn" onclick="capturePhoto()">📸 Capture</button>
      <button class="clear-btn" onclick="closeCamera()">Cancel</button>
    </div>
  </div>
</div>


<script>
let school = sessionStorage.getItem("school");
const school_name = sessionStorage.getItem("school_name");

const displayName = school_name || school;

document.getElementById("schoolName").innerText = displayName;
document.getElementById("schoolNameTop").innerText = displayName;

// Tracks the current student's existing photo public_id during edit (for delete-before-replace)
let currentEditPhotoLink = "";

/* TOAST */
function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}

function normalizeKey(str) {
  return str
    .toLowerCase()
    .replace(/[^a-z0-9]/g, "_")
    .replace(/_+/g, "_");
}

/* CLEAR */
function clearForm() {
  const inputs = document.querySelectorAll(
    "#dynamicForm input, #dynamicForm select, #dynamicForm textarea"
  );

  inputs.forEach(el => {
    const id = el.id;

    // Do not clear class & section
    if (id === "class" || id === "section") return;

    if (el.tagName === "SELECT") {
      el.selectedIndex = 0;
    } else {
      el.value = "";
    }

    // Reset textarea height
    if (el.tagName === "TEXTAREA") {
      el.style.height = "auto";
    }

    // Remove any red border (validation reset)
    el.style.border = "";
  });

  // Reset photo preview
  const preview = document.getElementById("photoPreview");
  if (preview) {
    preview.src = "";
    preview.style.display = "none";
  }

  // Focus first field
  document.getElementById("name")?.focus();
}

/* VALIDATION + SUBMIT */
let isSubmitting = false;

async function submitStudent() {
  const btn = document.querySelector(".submit-btn");

  if (isSubmitting) return;

  btn.disabled = true;
  isSubmitting = true;

  const raw = schoolsData;

  const headers = raw[0];

  const schools = raw.slice(1).map(r => {
    let obj = {};
    headers.forEach((h, i) => obj[h] = r[i]);
    return obj;
  });

  const currentSchool = schools.find(s => s.school === school);

  if (!currentSchool) {
    showToast("School config not found");
    isSubmitting = false;
    btn.disabled = false;
    return;
  }

  const fields = currentSchool.fields.split(",");

  let data = {
    school: school,
    school_id: sessionStorage.getItem("school_id"),
    added_by:   sessionStorage.getItem("username") || "unknown", 
    added_via:  "manual"  
  };

  let valid = true;

  fields.forEach(f => {
    const original = f.trim();
    const key = normalizeKey(original);

    const el = document.getElementById(key);
    if (!el) return;

    const value = el.value;

    if (!value && (key === "name" || key === "class")) {
      valid = false;

      const el = document.getElementById(key);
      if (el) {
        el.style.border = "2px solid red";

        setTimeout(() => {
          el.style.border = "";
        }, 2000);
      }
    }

    if (key === "dob") {
      if (value) {
        const digits = value.replace(/\D/g, "");

        if (digits.length !== 8) {
          valid = false;

          const el = document.getElementById(key);
          if (el) {
            el.style.border = "2px solid red";
            setTimeout(() => { el.style.border = ""; }, 2000);
          }

          showToast("Enter valid DOB (DDMMYYYY)");
        }
      }

      data[key] = formatDOB(value);
    }
    else {
      data[key] = value || "";
    }
  });

  // PHONE VALIDATION
  Object.keys(data).forEach(k => {
    if (k.includes("phone") || k.includes("contact")) {
      const val = data[k];

      if (val && val.length !== 10) {
        showToast("Please enter a valid 10-digit number");

        const el = document.getElementById(k);
        if (el) {
          el.style.border = "2px solid red";
          setTimeout(() => el.style.border = "", 2000);
        }

        valid = false;
      }
    }
  });

  if (!valid) {
    showToast("Fill required fields");
    isSubmitting = false;
    btn.disabled = false;
    return;
  }

  // Capture the selected photo file BEFORE clearForm() wipes the input
  const photoFile = document.getElementById("studentPhoto")?.files[0] || null;
  const capturedSchoolId = sessionStorage.getItem("school_id");

  // Show instantly (without ID). We keep THIS row, so the server's answer lands on it
  // even if more students are added before the answer arrives.
  // Receipt for this entry. Retry sends the SAME receipt, so the server can tell
  // "already saved" apart from "never arrived" and never adds the student twice.
  data.entry_ref = makeEntryRef();

  const row = addToRecentTable(data);
  clearForm();
  showToast("Saving…");

  saveNewStudent(data, row, photoFile, capturedSchoolId);   // not awaited: the operator can keep typing

  isSubmitting = false;
  btn.disabled = false;
}

// Sends one new student and updates ITS row. Never fails silently: if the server does not
// return an ID, the row turns red, keeps the typed data, and gets a Retry button.
async function saveNewStudent(data, row, photoFile, schoolIdForPhoto) {
  row.dataset.state = "saving";
  let res = null;
  try { res = await addStudent(data); } catch (err) { res = null; }

  if (!res || !res.student_id) {
    markRowFailed(row, data, photoFile, schoolIdForPhoto, (res && res.error) || "no answer from the server");
    return;
  }

  row.dataset.state = "saved";
  row.style.background = "";
  row.children[0].innerText = res.student_id;
  row.children[4].innerHTML = `
          <button class="edit-btn" onclick="editRecent(this, event)">Edit</button>
          <button class="delete-btn" onclick="deleteRecent(this)">Delete</button>`;
  showToast(res.already_saved
    ? "Already saved as " + res.student_id + " — not added twice"
    : "Saved: " + res.student_id);

  // fetch latest data for THIS student only
  const raw = await getStudents(data.school);
  const headers = raw[0] || [];
  const students = raw.slice(1).map(r => {
    let obj = {};
    headers.forEach((h, i) => obj[h] = r[i]);
    return obj;
  });
  const updated = students.find(s => s["Student_ID"] == res.student_id);

  if (updated) {
    // PATCH UI (NO FULL RELOAD)
    row.children[1].innerText = updated["Name"] || "";
    row.children[2].innerText = updated["Class"] || "";
    row.children[3].innerText = updated["Section"] || "";
    row.style.background = "#d1fae5";
    setTimeout(() => { if (row.dataset.state === "saved") row.style.background = ""; }, 1000);
  }

  // UPLOAD PHOTO (IF SELECTED) — runs after student_id is known
  if (photoFile) {
    try {
      const publicId = await uploadPhotoToCloudinary(photoFile, schoolIdForPhoto, res.student_id);
      await savePhotoLink(data.school, res.student_id, publicId);
      showToast("Photo uploaded");
    } catch (err) {
      console.error("Photo upload failed:", err);
      showToast("Student saved, but photo upload failed");
    }
  }
}

// Random receipt like "lq2x8k4f-9d3kz1p0a7" (letters, digits and -).
function makeEntryRef() {
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
}

function markRowFailed(row, data, photoFile, schoolIdForPhoto, reason) {
  row.dataset.state = "failed";
  row.style.background = "#fee2e2";
  row.children[0].innerHTML = '<span style="color:#b91c1c;font-weight:600;">Not saved</span>';
  row.children[4].innerHTML = '<button class="edit-btn">🔁 Retry</button>';
  row.children[4].querySelector("button").onclick = function (ev) {
    if (ev) ev.stopPropagation();
    if (row.dataset.state === "saving") return;
    this.disabled = true;
    this.innerText = "Saving…";
    row.style.background = "";
    row.children[0].innerText = "";
    saveNewStudent(data, row, photoFile, schoolIdForPhoto);
  };
  showToast("NOT saved: " + reason + " — press Retry");
}

function hasUnsavedRows() {
  return [...document.querySelectorAll("#recentTable tr")]
    .some(r => r.dataset.state === "failed" || r.dataset.state === "saving");
}

/* CHANGE SCHOOL */
function changeSchool() {
  document.getElementById("schoolBox").classList.add("active");
}

function applySchoolChange() {
  const dropdown = document.getElementById("schoolSelect");
  const selectedOption = dropdown.options[dropdown.selectedIndex];

  school = selectedOption.value;
  const school_name = selectedOption.textContent.trim();
  const school_id = selectedOption.getAttribute("data-id");

  if (!school) {
    alert("Please select a school");
    school = sessionStorage.getItem("school");
    return;
  }

  if (hasUnsavedRows() && !confirm("Some students in Recent Entries are NOT saved yet (red rows). If you change school they disappear from this screen. Change anyway?")) {
    school = sessionStorage.getItem("school");
    return;
  }

  sessionStorage.setItem("school", school);
  sessionStorage.setItem("school_name", school_name);
  sessionStorage.setItem("school_id", school_id);

  document.getElementById("schoolName").innerText = school_name;
  document.getElementById("schoolNameTop").innerText = school_name;

  renderDynamicForm();
  loadData();

  hideSchoolSelector();
}


/* LOAD */
async function loadData() {
  const raw = await getStudents(school);

  const headers = raw[0];

  const students = raw.slice(1).map(r => {
    let obj = {};
    headers.forEach((h, i) => obj[h] = r[i]);
    return obj;
  });

  const last3 = students.slice(-3).reverse();

  document.getElementById("recentTable").innerHTML =
    last3.map(s => `
      <tr>
        <td>${s["Student_ID"] || ""}</td>
        <td>${s["Name"] || ""}</td>
        <td>${s["Class"] || ""}</td>
        <td>${s["Section"] || ""}</td>
        <td>
          <button class="edit-btn" onclick="editRecent(this, event)">Edit</button>
          <button class="delete-btn" onclick="deleteRecent(this)">Delete</button>
        </td>
      </tr>
    `).join("");
}


async function editRecent(btn, e) {
  if (e) e.stopPropagation();

  const row = btn.closest("tr");
  const student_id = row.children[0].innerText;

  if (!student_id) {
    alert("Please wait... ID not generated yet");
    return;
  }

  openEditPopup(student_id, row);
}

function openEditPopup(student_id, row) {
  const container = document.getElementById("editModalContent");

  container.innerHTML = `
    <div class="school-header">
      <h3>Edit Student</h3>
      <span class="close-btn" onclick="closeEditPopup()">✖</span>
    </div>

    <p style="text-align:center; margin-top:20px;">
      ⏳ Loading student data...
    </p>
  `;

  document.getElementById("editPopup").classList.add("active");

  loadEditData(student_id);
}

async function loadEditData(student_id) {

  const container = document.getElementById("editModalContent");

  const raw = await getStudents(school);
  const headers = raw[0];

  const students = raw.slice(1).map(r => {
    let obj = {};
    headers.forEach((h, i) => obj[h] = r[i]);
    return obj;
  });

  const student = students.find(s => s["Student_ID"] == student_id);
  if (!student) return;

  const schoolRaw = schoolsData;
  const schoolHeaders = schoolRaw[0];

  const schools = schoolRaw.slice(1).map(r => {
    let obj = {};
    schoolHeaders.forEach((h, i) => obj[h] = r[i]);
    return obj;
  });

  const currentSchool = schools.find(s => s.school === school);
  const fields = currentSchool.fields.split(",");

  let html = `
    <div class="school-header">
      <h3>Edit Student</h3>
      <span class="close-btn" onclick="closeEditPopup()">✖</span>
    </div>
  `;

  html += `
    <div class="form-row">
      <label>Student ID</label>
      <input value="${student_id}" disabled>
    </div>
  `;

  // PHOTO ROW — shows current photo (if any) + file input to replace
  currentEditPhotoLink = student["Photo_Link"] || "";

  html += `
    <div class="form-row">
      <label>Photo</label>
      <div class="photo-upload-wrap">
        ${
          currentEditPhotoLink
            ? `<img src="${getPhotoUrl(currentEditPhotoLink, 'w_100,h_100,c_fill')}" alt="Current photo">`
            : `<span class="no-photo-label">No photo</span>`
        }
        <input type="file" id="edit_photo_file" accept="image/*">
      </div>
    </div>
  `;

  fields.forEach(f => {
    const original = f.trim();
    const key = normalizeKey(original);

    let value = student[original] || "";

    if (key === "dob") {
      value = formatDOB(value);
    }

    html += `<div class="form-row"><label>${original} :</label>`;

    if (key === "class") {
      html += `
        <select id="edit_${key}">
          <option value="" ${value === "" ? "selected" : ""}>— Select —</option>
          ${CONFIG.classes.map(c =>
            `<option value="${c}" ${c == value ? "selected" : ""}>${c}</option>`
          ).join("")}
        </select>
      `;
    }
    else if (key === "section") {
      html += `
        <select id="edit_${key}">
          <option value="" ${value === "" ? "selected" : ""}>— Select —</option>
          ${CONFIG.sections.map(s =>
            `<option value="${s}" ${s == value ? "selected" : ""}>${s}</option>`
          ).join("")}
        </select>
      `;
    }

    else {
      html += `<input id="edit_${key}" value="${value}">`;
    }

    html += `</div>`;
  });

  html += `
    <br>
    <button class="submit-btn" onclick="saveEdit(${student_id})">Save</button>
    <button class="clear-btn" onclick="closeEditPopup()">Cancel</button>
  `;

  container.innerHTML = html;
  if (typeof attachDOBFormatterAll === "function") attachDOBFormatterAll();
  
}

async function saveEdit(student_id) {

  let params = new URLSearchParams({
    action: "updateStudent",
    school: school,
    student_id: student_id
  });

  const raw = schoolsData;
  const headers = raw[0];

  const schools = raw.slice(1).map(r => {
    let obj = {};
    headers.forEach((h, i) => obj[h] = r[i]);
    return obj;
  });

  const currentSchool = schools.find(s => s.school === school);
  const fields = currentSchool.fields.split(",");

  fields.forEach(f => {
    const key = normalizeKey(f.trim());
    const el = document.getElementById(`edit_${key}`);

    if (el) {
      let value = el.value || "";

      if (key === "dob") {
        value = formatDOB(value);
      }

      params.append(key, value);
    }
  });

  // Capture new photo file + old photo link BEFORE the popup closes
  const newPhotoFile = document.getElementById("edit_photo_file")?.files[0] || null;
  const oldPhotoLink = currentEditPhotoLink;
  const editSchoolId = sessionStorage.getItem("school_id");

  // find row in table FIRST (for instant update)
  const rows = document.querySelectorAll("#recentTable tr");
  let targetRow = null;

  rows.forEach(row => {
    if (row.children[0].innerText == student_id) {
      targetRow = row;
    }
  });

  // STEP 1: instant UI update
  if (targetRow) {
    targetRow.children[1].innerText = document.getElementById("edit_name")?.value || "";
    targetRow.children[2].innerText = document.getElementById("edit_class")?.value || "";
    targetRow.children[3].innerText = document.getElementById("edit_section")?.value || "";
  }

  showToast("Saving…");
  closeEditPopup();

  // STEP 2: backend update - only report success when the server confirms it
  let editRes = null;
  try { editRes = await (await fetch(`${API_URL}?${params.toString()}`)).json(); } catch (err) { editRes = null; }
  if (!editRes || editRes.error) {
    showToast("NOT saved: " + ((editRes && editRes.error) || "no answer from the server"));
    loadData();   // show what is really stored
    return;
  }
  showToast("Updated successfully");

  // STEP 2.5: handle photo replacement (delete old → upload new → save link)
  if (newPhotoFile) {
    try {
      if (oldPhotoLink) {
        const oldPublicId = oldPhotoLink.split("|")[0];
        await deleteCloudinaryPhoto(oldPublicId);
      }
      const publicId = await uploadPhotoToCloudinary(newPhotoFile, editSchoolId, student_id);
      await savePhotoLink(school, student_id, publicId);
      showToast("Photo updated");
    } catch (err) {
      console.error("Photo update failed:", err);
      showToast("Details saved, but photo update failed");
    }
  }

  // STEP 3: fetch latest backend data
  const rawData = await getStudents(school);

  const hdrs = rawData[0];
  const students = rawData.slice(1).map(r => {
    let obj = {};
    hdrs.forEach((h, i) => obj[h] = r[i]);
    return obj;
  });

  const updated = students.find(s => s["Student_ID"] == student_id);

  if (!updated || !targetRow) return;

  // STEP 4: patch with REAL backend data
  targetRow.children[1].innerText = updated["Name"] || "";
  targetRow.children[2].innerText = updated["Class"] || "";
  targetRow.children[3].innerText = updated["Section"] || "";

  // STEP 5: highlight
  targetRow.style.background = "#d1fae5";

  setTimeout(() => {
    targetRow.style.background = "";
  }, 1000);
}

function closeEditPopup() {
  document.getElementById("editPopup").classList.remove("active");
}

async function syncLatestData(student_id) {
  try {
    const raw = await getStudents(school);
    const headers = raw[0];

    const students = raw.slice(1).map(r => {
      let obj = {};
      headers.forEach((h, i) => obj[h] = r[i]);
      return obj;
    });

    const student = students.find(s => s["Student_ID"] == student_id);
    if (!student) return;

    Object.keys(student).forEach(key => {
      const input = document.getElementById(`edit_${normalizeKey(key)}`);
      if (input) {
        input.value = student[key] || "";
      }
    });

  } catch (err) {
    console.warn("Sync failed", err);
  }
}

async function deleteRecent(btn) {
  const row = btn.closest("tr");
  const student_id = row.children[0].innerText;

  if (!student_id) {
    alert("Please wait... ID not generated yet");
    return;
  }

  if (!confirm("Delete this student?")) return;

  const url = `${API_URL}?action=deleteStudent&school=${encodeURIComponent(school)}&student_id=${encodeURIComponent(student_id)}`;

  let delRes = null;
  try { delRes = await (await fetch(url)).json(); } catch (err) { delRes = null; }
  if (!delRes || delRes.error) {
    showToast("NOT deleted: " + ((delRes && delRes.error) || "no answer from the server"));
    return;
  }

  row.remove();

  showToast("Deleted successfully");
}

/* Load Schools + Pre-select */

async function loadSchools() {

  const dropdown = document.getElementById("schoolSelect");

  dropdown.innerHTML = "<option>Loading...</option>";

  const raw = await getSchools();

  schoolsData = raw;

  // safety check
  if (!raw || raw.length === 0) {
    dropdown.innerHTML = "<option>No Schools Found</option>";
    return;
  }

  const headers = raw[0];

  const schools = raw.slice(1).map(r => {
    let obj = {};
    headers.forEach((h, i) => obj[h] = r[i]);
    return obj;
  });

  dropdown.innerHTML = '<option value="">Select School</option>';

  dropdown.innerHTML += schools.map(s => `
    <option value="${s.school}" data-id="${s.school_id}">
      ${s.school_name}
    </option>
  `).join("");

  const school = sessionStorage.getItem("school");

  if (school) {
    dropdown.value = school;
  }

  renderDynamicForm();
  loadData();
}


function hideSchoolSelector() {
  document.getElementById("schoolBox").classList.remove("active");
}

// ESC close
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    hideSchoolSelector();
    closeCamera();
  }
});

// Click outside
document.addEventListener("click", function(e) {
  const schoolBox = document.getElementById("schoolBox");
  const editBox = document.getElementById("editPopup");

  // SCHOOL MODAL
  if (schoolBox.classList.contains("active")) {
    const modal = schoolBox.querySelector(".modal");

    if (!modal.contains(e.target)) {
      hideSchoolSelector();
    }
  }

  // EDIT MODAL
  if (editBox.classList.contains("active")) {
    const modal = editBox.querySelector(".modal");

    if (!modal.contains(e.target)) {
      closeEditPopup();
    }
  }
});

async function renderDynamicForm() {

  const raw = schoolsData;

  const headers = raw[0];

  const schools = raw.slice(1).map(r => {
    let obj = {};
    headers.forEach((h, i) => obj[h] = r[i]);
    return obj;
  });

  const currentSchool = schools.find(s => s.school === school);
  if (!currentSchool) return;

  const fields = currentSchool.fields.split(",");

  const container = document.getElementById("dynamicForm");
  container.innerHTML = "";

  // PHOTO UPLOAD FIELD (fixed — not part of the school's dynamic field list)
  container.innerHTML += `
    <div class="form-row">
      <label>Photo :</label>
      <div class="photo-upload-wrap">
        <img id="photoPreview" src="" alt="" style="display:none;">
        <input type="file" id="studentPhoto" accept="image/*">
        <button type="button" class="camera-btn" onclick="openCamera()">📷 Take Photo</button>
      </div>
    </div>
  `;

  fields.forEach((f) => {

    const original = f.trim();
    const key = normalizeKey(original);

    let html = "";

    // CLASS + SECTION SAME ROW
    if (key === "class" && fields.map(x => x.trim().toLowerCase()).includes("section")) {

      html = `
        <div class="form-row double">
          <div>
            <label>Class *</label>
            <select id="class">
              <option value="">Select</option>
              ${CONFIG.classes.map(c => `<option value="${c}">${c}</option>`).join("")}
            </select>
          </div>

          <div>
            <label>Section</label>
            <select id="section">
              <option value="">Select</option>
              ${CONFIG.sections.map(s => `<option value="${s}">${s}</option>`).join("")}
            </select>
          </div>
        </div>
      `;

      container.innerHTML += html;
      return; // skip section
    }

    if (key === "section") return;

    // DOB FIELD
    if (key === "dob") {
      html = `
        <div class="form-row">
          <label>${original} :</label>
          <input id="${key}" type="text" inputmode="numeric" maxlength="8" placeholder="DDMMYYYY">
        </div>
      `;
    }

    // PHONE FIELD
    else if (key.includes("phone") || key.includes("contact")) {
      html = `
        <div class="form-row">
          <label>${original} :</label>
          <input id="${key}" inputmode="numeric" maxlength="10">
        </div>
      `;
    }

    // ADDRESS FIELD
    else if (key.includes("address")) {
      html = `
        <div class="form-row">
          <label>${original} :</label>
          <textarea id="${key}" rows="1"></textarea>
        </div>
      `;
    }

    // NAME REQUIRED
    else if (key === "name") {
      html = `
        <div class="form-row">
          <label>${original} *</label>
          <input id="${key}">
        </div>
      `;
    }

    // DEFAULT FIELD
    else {
      html = `
        <div class="form-row">
          <label>${original} :</label>
          <input id="${key}">
        </div>
      `;
    }

    container.innerHTML += html;
  });

  // Attach all behaviors
  attachDOBFormatterAll();
  attachPhoneValidation();
  attachAutoExpand();
  attachEnterNavigation();
  attachPhotoPreview();
}

// Live preview when a photo is selected in Add Student form
function attachPhotoPreview() {
  const input = document.getElementById("studentPhoto");
  const preview = document.getElementById("photoPreview");
  if (!input || !preview) return;

  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) {
      preview.style.display = "none";
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      preview.src = e.target.result;
      preview.style.display = "block";
    };
    reader.readAsDataURL(file);
  });
}

function addToRecentTable(data) {
  const table = document.getElementById("recentTable");

  const row = `
    <tr>
      <td>${data.student_id || ""}</td>
      <td>${data.name || ""}</td>
      <td>${data.class || ""}</td>
      <td>${data.section || ""}</td>
      <td>
        <button class="edit-btn" onclick="editRecent(this, event)">Edit</button>
        <button class="delete-btn" onclick="deleteRecent(this)">Delete</button>
      </td>
    </tr>
  `;

  // insertAdjacentHTML keeps the existing rows (rebuilding them would lose which row is which)
  table.insertAdjacentHTML("afterbegin", row);
  const newRow = table.firstElementChild;

  // Keep 3 rows, but never drop a row that is still saving or failed (it holds data for Retry)
  let rows = [...table.querySelectorAll("tr")];
  while (rows.length > 3) {
    const victim = rows.slice().reverse().find(r => r.dataset.state !== "failed" && r.dataset.state !== "saving");
    if (!victim) break;
    victim.remove();
    rows = [...table.querySelectorAll("tr")];
  }
  return newRow;
}

/* CAMERA CAPTURE */
let cameraStream = null;

async function openCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }
    });
    document.getElementById("cameraVideo").srcObject = cameraStream;
    document.getElementById("cameraPopup").classList.add("active");
  } catch (err) {
    console.error("Camera access failed:", err);
    showToast("Camera access denied or unavailable");
  }
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }
  const popup = document.getElementById("cameraPopup");
  if (popup) popup.classList.remove("active");
}

function capturePhoto() {
  const video  = document.getElementById("cameraVideo");
  const canvas = document.getElementById("cameraCanvas");

  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  canvas.toBlob(blob => {
    const file = new File([blob], `student_photo_${Date.now()}.jpg`, { type: "image/jpeg" });

    // Push the captured photo into the SAME file input used for uploads
    const dataTransfer = new DataTransfer();
    dataTransfer.items.add(file);
    document.getElementById("studentPhoto").files = dataTransfer.files;

    // Trigger the existing preview logic (already wired via attachPhotoPreview)
    document.getElementById("studentPhoto").dispatchEvent(new Event("change"));

    closeCamera();
    showToast("Photo captured");
  }, "image/jpeg", 0.9);
}

function formatDOB(value) {
  if (!value) return "";

  let str = value.toString().trim();

  str = str.replace(/-/g, "/");

  let digits = str.replace(/\D/g, "");

  // Case 1: 8 digit input (12072001)
  if (digits.length === 8) {
    let day = digits.substring(0, 2);
    let month = digits.substring(2, 4);
    let year = digits.substring(4, 8);

    return `${day}/${month}/${year}`;
  }

  // Case 2: split input (12/7/2001 etc.)
  let parts = str.split("/");

  if (parts.length === 3) {
    let [day, month, year] = parts;

    day = String(day).padStart(2, "0");
    month = String(month).padStart(2, "0");

    return `${day}/${month}/${year}`;
  }

  return str;
}
